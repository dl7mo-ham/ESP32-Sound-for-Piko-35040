name: CI

# Gemeinsame CI aller ESP32-Module (RC_Common 1.0.0):
#   1. firmware/src/RC_Common/ gegen MANIFEST.sha256 pruefen (Kopie
#      unveraendert) und die Host-Tests der Basis ausfuehren.
#   2. Firmware bauen (Arduino-Core 3.0.7) und die Images hochladen.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  rc-common:
    name: RC_Common pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Kopie unveraendert (MANIFEST.sha256)
        run: cd firmware/src/RC_Common && sha256sum -c --quiet MANIFEST.sha256
      - name: Host-Tests
        run: sh firmware/src/RC_Common/tests/run_tests.sh

  build-firmware:
    name: Build firmware (S3)
    needs: rc-common
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      # Eine einzige Datei zum Flashen ab Adresse 0x0 (Bootloader,
      # Partitionstabelle, OTA-Startdaten und Firmware zusammengefuegt),
      # z. B. mit https://espressif.github.io/esptool-js/
      - name: Merge flash image
        run: |
          pip install esptool==4.8.1
          B=.pio/build/s3
          esptool.py --chip esp32s3 merge_bin -o $B/sound-mini-s3-komplett.bin \
            --flash_mode keep --flash_freq keep --flash_size 4MB \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sound-mini-s3-firmware
          path: |
            firmware/.pio/build/s3/sound-mini-s3-komplett.bin
            firmware/.pio/build/s3/firmware.bin
