; Soundmodul Mini (S3) - PlatformIO-Projekt
;
; Aufruf (im Ordner firmware/):
;   pio run              Firmware bauen
;   pio run -t upload    bauen und flashen
;   pio run -t uploadfs  Sounds aus data/ ins Flash (LittleFS)

[platformio]
default_envs = s3

[env:s3]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 4 MB Flash: 2 x 1,25 MB App (OTA) + ca. 1,3 MB Dateisystem fuer Sounds
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; Konsole ueber den nativen USB-Anschluss, UARTs bleiben frei
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; S3FH4R2: 2 MB PSRAM (Quad-SPI)
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_qspi
