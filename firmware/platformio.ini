; Soundmodul Mini (S3) - PlatformIO-Projekt
;
; Aufruf (im Ordner firmware/):
;   pio run              Firmware bauen
;   pio run -t upload    bauen und flashen
;   pio run -t uploadfs  Sounds aus data/ ins Flash (LittleFS)

[platformio]
default_envs = s3

[env:s3]
; Arduino-ESP32 Core 3.0.7 (ESP-IDF 5.1) ueber pioarduino, gleicher Core wie
; alle anderen ESP32-Firmwaren (Multiswitch: arduino-cli esp32:esp32@3.0.7)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 4 MB Flash: 2 x 1,25 MB App (OTA) + ca. 1,3 MB Dateisystem fuer Sounds
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.filesystem = littlefs
; Core 3.x baut mit gnu++2b, die C++17-Teile laufen damit ohne eigenes -std
build_flags =
    -Wall
    -Wextra
    ; Konsole ueber den nativen USB-Anschluss, UARTs bleiben frei
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; S3FH4R2: 2 MB PSRAM (Quad-SPI)
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_qspi
lib_deps =
    ; RC_Common (CRSF, UART-Rollen, S.Port, GPS, Lua-Menue, LED, ...) liegt
    ; als Kopie unter src/RC_Common/ und braucht keinen Eintrag. GPS (Rolle
    ; auf Port B/C, gps_speed.cpp) wird immer mitgebaut:
    mikalhart/TinyGPSPlus @ 1.1.0
